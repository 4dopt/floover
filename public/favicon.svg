<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Obsidian-Navy Canvas -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="50%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#1e1b4b" />
    </linearGradient>

    <!-- Theme-Matched Indigo Done Checkmark Gradient -->
    <linearGradient id="fav-check" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#4338ca" />
      <stop offset="35%" stopColor="#4f46e5" />
      <stop offset="70%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#818cf8" />
    </linearGradient>

    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Bold, Thick Radiant "Done" Checkmark -->
  <g filter="url(#fav-glow)">
    <path d="M16 33L27.5 44.5L48 19" stroke="url(#fav-check)" stroke-width="8.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M16 33L27.5 44.5L48 19" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" />
  </g>
</svg>
