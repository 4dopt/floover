<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Obsidian-Navy Blueprint Canvas -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="60%" stopColor="#0f172a" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Wall Gradient -->
    <linearGradient id="fav-wall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#4f46e5" />
    </linearGradient>

    <!-- Table Gradient -->
    <linearGradient id="fav-table" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>

    <!-- Theme-Matched Indigo Done Checkmark Gradient -->
    <linearGradient id="fav-check" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#4338ca" />
      <stop offset="40%" stopColor="#4f46e5" />
      <stop offset="75%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#818cf8" />
    </linearGradient>

    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#6366f1" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect width="64" height="64" rx="16" fill="url(#fav-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.2" stroke-opacity="0.4" />

  <!-- Blueprint Grid -->
  <path d="M16 6v52M32 6v52M48 6v52M6 16h52M6 32h52M6 48h52" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.5" />

  <!-- Floor Plan Boundary Wall -->
  <path d="M44 14H14V50H32" stroke="url(#fav-wall)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Door Arc -->
  <path d="M32 50A12 12 0 0 1 44 38" stroke="#64748b" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />
  <line x1="32" y1="50" x2="44" y2="38" stroke="#94a3b8" stroke-width="1.2" opacity="0.75" />

  <!-- Interior Seating Elements -->
  <rect x="20" y="19" width="4.5" height="2" rx="1" fill="#c7d2fe" />
  <rect x="27.5" y="19" width="4.5" height="2" rx="1" fill="#c7d2fe" />
  <rect x="20" y="29" width="4.5" height="2" rx="1" fill="#c7d2fe" />
  <rect x="27.5" y="29" width="4.5" height="2" rx="1" fill="#c7d2fe" />
  <rect x="18" y="22" width="16" height="6" rx="2.5" fill="url(#fav-table)" />

  <circle cx="21" cy="35" r="1.3" fill="#c7d2fe" />
  <circle cx="21" cy="47" r="1.3" fill="#c7d2fe" />
  <circle cx="15" cy="41" r="1.3" fill="#c7d2fe" />
  <circle cx="27" cy="41" r="1.3" fill="#c7d2fe" />
  <circle cx="21" cy="41" r="4.2" fill="#4f46e5" />

  <!-- Radiant "Done" Checkmark -->
  <g filter="url(#fav-glow)">
    <path d="M26 36L36 47L54 17" stroke="url(#fav-check)" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M26 36L36 47L54 17" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  </g>

  <!-- Precision Completion Point in Theme Indigo -->
  <circle cx="54" cy="17" r="4.5" fill="#6366f1" opacity="0.35" />
  <circle cx="54" cy="17" r="2.6" fill="#ffffff" />
  <circle cx="54" cy="17" r="1.2" fill="#4f46e5" />
</svg>
