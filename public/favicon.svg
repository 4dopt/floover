<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="flv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e1b4b" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="flv-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="flv-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#4f46e5" />
    </linearGradient>
    <linearGradient id="flv-chair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#e0e7ff" />
      <stop offset="100%" stopColor="#c7d2fe" />
    </linearGradient>
    <filter id="flv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="64" height="64" rx="16" fill="url(#flv-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#3730a3" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Blueprint grid subtle background -->
  <path d="M16 4v56M32 4v56M48 4v56M4 16h56M4 32h56M4 48h56" stroke="#334155" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.25" />

  <!-- Architectural Backbone / Wall -->
  <rect x="13" y="14" width="9" height="36" rx="4.5" fill="#4338ca" />

  <!-- Upper Dining Table (Top Arm of F) -->
  <g filter="url(#flv-glow)">
    <!-- Chairs above table -->
    <rect x="22" y="9" width="6" height="3.5" rx="1.5" fill="url(#flv-chair)" />
    <rect x="31" y="9" width="6" height="3.5" rx="1.5" fill="url(#flv-chair)" />
    <rect x="40" y="9" width="6" height="3.5" rx="1.5" fill="url(#flv-chair)" />
    
    <!-- Table Body -->
    <rect x="17" y="14" width="33" height="11" rx="5.5" fill="url(#flv-accent)" />
  </g>

  <!-- Middle Dining Table (Mid Arm of F) -->
  <g>
    <!-- Table Body -->
    <rect x="17" y="30" width="23" height="10" rx="5" fill="url(#flv-mid)" />
    
    <!-- Chairs below mid table -->
    <rect x="22" y="42" width="6" height="3.5" rx="1.5" fill="url(#flv-chair)" />
    <rect x="31" y="42" width="6" height="3.5" rx="1.5" fill="url(#flv-chair)" />
  </g>

  <!-- Live Cover / Active Seat Sensor Indicator in bottom-right quadrant -->
  <g>
    <circle cx="48" cy="43" r="5.5" fill="#10b981" />
    <circle cx="48" cy="43" r="2.5" fill="#ffffff" />
  </g>
</svg>
